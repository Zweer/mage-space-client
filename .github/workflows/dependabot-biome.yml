name: Dependabot Biome Migrate

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  pull-requests: read

jobs:
  biome-migrate:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      - name: Run biome migrate
        run: npx @biomejs/biome migrate --write

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biome.json
          git diff --cached --quiet || git commit -m "chore: run biome migrate after version bump"
          git push
